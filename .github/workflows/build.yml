name: Build ARIN APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Stable signing key (made once, reused every build)
        run: |
          if [ ! -f arin.keystore ]; then
            keytool -genkeypair -keystore arin.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ARIN,O=ARIN,C=BD"
            git config user.name "arin-bot"
            git config user.email "arin-bot@users.noreply.github.com"
            git add arin.keystore
            git commit -m "add signing key"
            git push
          fi
          mkdir -p ~/.android
          cp arin.keystore ~/.android/debug.keystore
      - name: Create Android app
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init ARIN com.arin.assistant --web-dir=www
          npx cap add android
          APPDIR=android/app/src/main/java/com/arin/assistant
          cat > $APPDIR/ArinPlugin.java <<'JAVA'
          package com.arin.assistant;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "Arin")
          public class ArinPlugin extends Plugin {
            @PluginMethod
            public void openUri(PluginCall call) {
              String u = call.getString("uri");
              if (u == null) { call.reject("no uri"); return; }
              try {
                Intent i = u.startsWith("intent:") ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME) : new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $APPDIR/MainActivity.java <<'JAVA'
          package com.arin.assistant;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ArinPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          q = '<queries><intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>'
          s = s.replace("<application", q + "<application", 1)
          s = s.replace("<application", '<uses-permission android:name="com.android.alarm.permission.SET_ALARM"/><application', 1)
          open(p, "w").write(s)
          PY
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARIN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
