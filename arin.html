<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>ARIN</title>
<style>
:root{--c:255,40,40;--bg:#050607;--panel:#0d0f12;--line:#1c2026;--tx:#e8eaed;--mut:#7d8590;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.35em;font-size:15px;color:rgb(var(--c))}
header span{font-size:11px;color:var(--mut)}
#stage{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:6px}
canvas{width:180px;height:180px}
#log{min-height:110px}
#agents{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
#agents button{flex:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:6px 11px;font:inherit;font-size:12px;display:flex;gap:6px;align-items:center}
#agents button i{width:8px;height:8px;border-radius:50%;display:block}
#agents button.on{border-color:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.35)}
#who{font-size:11px;color:var(--mut);padding:5px 14px 0}
#stage:not(.on){display:none}
#state{font-size:12px;color:var(--mut);margin-top:-6px;height:16px}
#nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;padding:12px 14px 6px;position:relative}
#nodes::before{content:"";position:absolute;left:14%;right:14%;top:0;height:12px;border:1px solid rgba(var(--c),.45);border-bottom:0;border-radius:10px 10px 0 0}
.node{background:var(--panel);color:var(--tx);border:1px solid rgba(var(--c),.45);border-radius:10px;padding:9px 0;font-size:12px;box-shadow:0 0 12px rgba(var(--c),.15)}
.node:active{background:rgba(var(--c),.18)}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}
.m.u{align-self:flex-end;background:rgba(var(--c),.14);border-color:rgba(var(--c),.4)}
.m.e{color:#ff9b9b}
.m.act{border-color:rgb(var(--c));align-self:flex-start}
.m a.go{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:14px;background:rgb(var(--c));color:#000;text-decoration:none;font-weight:700;font-size:13px}
#toast{position:fixed;top:10px;left:10px;right:10px;z-index:99;padding:12px 14px;border-radius:12px;background:rgb(var(--c));color:#000;font-weight:700;display:none}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#txt{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:22px;padding:11px 14px;font:inherit;font-size:14px;outline:none;min-width:0}
#txt:focus{border-color:rgb(var(--c))}
.btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(var(--c),.6);background:var(--panel);color:var(--tx);font-size:18px;flex:none}
#mic.on{background:rgb(var(--c));color:#000;box-shadow:0 0 18px rgba(var(--c),.7)}
#stop{font-size:11px;width:auto;border-radius:20px;padding:0 12px;height:34px}
#sheet{position:fixed;inset:auto 0 0 0;max-height:72%;overflow-y:auto;background:var(--panel);border-top:1px solid rgb(var(--c));border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
#sheet.open{transform:none}
#sheet h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font:inherit;font-size:14px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #333;display:block}
.sw input[type=color]{width:42px;height:34px;padding:0;border-radius:8px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.pill u{color:rgb(var(--c));text-decoration:none}
.go{background:rgb(var(--c));color:#000;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600}

#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font:inherit;font-size:13px;border-bottom:2px solid transparent}
#tabs button.on{color:rgb(var(--c));border-bottom-color:rgb(var(--c))}
.view{display:none;flex-direction:column;align-items:center;padding:8px 12px}
.view.on{display:flex}
.view canvas.w{width:100%;max-width:360px;height:auto;image-rendering:pixelated;border:1px solid rgba(var(--c),.4);border-radius:10px;background:var(--bg)}
.cap{font-size:11px;color:var(--mut);margin-top:6px;text-align:center}
.feed{width:100%;max-width:360px;margin-top:8px}
.feed div{font-size:11px;color:var(--mut);border-left:2px solid rgba(var(--c),.5);padding:3px 8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<header><b>ARIN</b><span id="net">অফলাইন</span></header>
<div id="tabs"><button class="on" data-t="orb">Orb</button><button data-t="media">Media</button><button data-t="town">Agent Town</button></div>
<div id="toast" onclick="this.style.display='none'"></div><div id="agents"></div><div id="who"></div>
<div id="stage" class="view on">
  <canvas id="orb" width="460" height="460"></canvas>
  <div id="state">প্রস্তুত</div>
  <div id="nodes">
    <button class="node" data-p="memory">Memory</button>
    <button class="node" data-p="skills">Skills</button>
    <button class="node" data-p="voices">Voices</button>
    <button class="node" data-p="settings">Settings</button>
  </div>
</div>
<div id="v-media" class="view">
  <canvas class="w" id="gl" width="360" height="230"></canvas>
  <div class="cap">Media Link (ডেমো ডিজাইন)</div>
  <div class="feed"><div>সিগন্যাল খুঁজছি…</div><div>কেন্দ্রীয় টেলিমেট্রির সাথে যুক্ত হচ্ছি…</div><div>ভৌগোলিক তথ্য আনছি…</div><div>লাইভ খবর যোগ হবে পরের ধাপে</div></div>
</div>
<div id="v-town" class="view">
  <canvas class="w" id="tw" width="960" height="684"></canvas>
  <div class="cap" id="twst">● Online</div>
  <div class="cap">Agent Town: যেকোনো এজেন্টের গায়ে চাপ দিলে তার সাথে কথা বলা যাবে</div>
</div>
<div id="log"></div>
<div id="bar">
  <button class="btn" id="stop" title="থামাও">থামাও</button>
  <input id="txt" placeholder="ARIN-কে লিখুন…" autocomplete="off">
  <button class="btn" id="send">➤</button>
  <button class="btn" id="mic">🎤</button>
</div>
<div id="sheet"></div>

<script>
const $=s=>document.querySelector(s);
const S={key:'',lang:'bn-BD',voice:'',rgb:'255,40,40',bg:'5,6,7',agent:'arin',rem:[],notes:[],model:'gemini-2.5-flash'};
try{Object.assign(S,JSON.parse(localStorage.getItem('arin')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('arin',JSON.stringify(S))}catch(e){}};
function theme(){const r=document.documentElement.style,b=S.bg.split(',').map(Number),lt=(b[0]*.3+b[1]*.59+b[2]*.11)>140,sh=d=>b.map(v=>Math.max(0,Math.min(255,v+(lt?-d:d)))).join(',');
r.setProperty('--c',S.rgb);r.setProperty('--bg','rgb('+S.bg+')');r.setProperty('--panel','rgb('+sh(10)+')');r.setProperty('--line','rgb('+sh(26)+')');r.setProperty('--tx',lt?'#14171a':'#e8eaed');r.setProperty('--mut',lt?'#5b636d':'#7d8590');
const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','rgb('+S.bg+')')}theme();
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',');
const rgb2hex=r=>'#'+r.split(',').map(n=>(+n).toString(16).padStart(2,'0')).join('');
$('#net').textContent=navigator.onLine?'অনলাইন':'অফলাইন';
addEventListener('online',()=>$('#net').textContent='অনলাইন');
addEventListener('offline',()=>$('#net').textContent='অফলাইন');

/* ---------- Orb ---------- */
const cv=$('#orb'),g=cv.getContext('2d');
const P=Array.from({length:520},()=>{const u=Math.random()*2-1,t=Math.random()*6.283,r=Math.sqrt(1-u*u);return{x:r*Math.cos(t),y:u,z:r*Math.sin(t),s:Math.random()*1.3+.5}});
let mode='idle',ang=0,energy=0;
function draw(){
  const W=460,k=mode==='listen'?1.12:mode==='speak'?1.06:mode==='think'?.96:1;
  energy+=((mode==='idle'?0:1)-energy)*.05;
  ang+=.004+energy*.012;
  g.clearRect(0,0,W,W);
  const pulse=1+Math.sin(Date.now()/(mode==='speak'?120:380))*.04*energy;
  const R=150*k*pulse,ca=Math.cos(ang),sa=Math.sin(ang);
  for(const p of P){
    const x=p.x*ca+p.z*sa,z=-p.x*sa+p.z*ca,y=p.y;
    const f=(z+1.4)/2.4,a=.15+f*.85;
    g.fillStyle=`rgba(${S.rgb},${a})`;
    g.beginPath();g.arc(W/2+x*R,W/2+y*R,p.s*f*1.6,0,6.283);g.fill();
  }
  const gr=g.createRadialGradient(W/2,W/2,R*.2,W/2,W/2,R*1.3);
  gr.addColorStop(0,`rgba(${S.rgb},${.12+energy*.1})`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,W);
  requestAnimationFrame(draw);
}
draw();
const setMode=(m,t)=>{mode=m;$('#state').textContent=t};

/* ---------- Chat ---------- */
const AGENTS=[
{id:'arin',n:'ARIN',r:'প্রধান সহকারী',col:'192,57,43',p:'তুমি ARIN, শিক্ষার্থীর প্রধান সহকারী। সাধারণ প্রশ্নের উত্তর দাও, আর কাজটি বিশেষ হলে বলো কোন এজেন্ট (GURU, MATH, LANG, QUIZ, PLAN) ভালো সাহায্য করবে।'},
{id:'guru',n:'GURU',r:'শিক্ষক: পাঠ সহজে বোঝান',col:'42,111,176',p:'তুমি GURU, ধৈর্যশীল শিক্ষক। যেকোনো পাঠ ছোট ছোট ধাপে, সহজ উদাহরণ দিয়ে বোঝাও এবং শেষে একটি প্রশ্ন করে বোঝা যাচাই করো।'},
{id:'math',n:'MATH',r:'গণিত ও বিজ্ঞান সমাধান',col:'46,139,87',p:'তুমি MATH, গণিত, পদার্থ, রসায়ন ও জীববিজ্ঞানের সমাধানকারী। ধাপে ধাপে হিসাব দেখাও, সূত্র বলো, শেষে উত্তর যাচাই করো।'},
{id:'lang',n:'LANG',r:'ভাষা ও লেখা',col:'123,79,181',p:'তুমি LANG, বাংলা ও ইংরেজির শিক্ষক। ব্যাকরণ, অনুবাদ, রচনা, চিঠি ও অনুচ্ছেদ লেখায় সাহায্য করো এবং ভুল শুধরে কারণ বুঝিয়ে দাও।'},
{id:'quiz',n:'QUIZ',r:'কুইজ ও পরীক্ষার প্রস্তুতি',col:'184,135,42',p:'তুমি QUIZ, পরীক্ষার প্রশিক্ষক। একবারে একটি প্রশ্ন করো, উত্তরের পর সঠিক বা ভুল জানিয়ে ব্যাখ্যা দাও, তারপর পরের প্রশ্ন দাও।'},
{id:'plan',n:'PLAN',r:'স্টাডি প্ল্যান ও রুটিন',col:'20,150,170',p:'তুমি PLAN, পড়ার পরিকল্পনাকারী। শিক্ষার্থীর সময়, বিষয় ও পরীক্ষার তারিখ জেনে বাস্তবসম্মত দৈনিক রুটিন বানাও।'}];
const MSG={},HIST={};
AGENTS.forEach(a=>{HIST[a.id]=[];MSG[a.id]=[['আমি '+a.n+', '+a.r+'। মাইক চাপুন বা লিখুন।'+(a.id==='arin'?' প্রথমে Settings-এ Gemini API key বসান। বলুন: "ইউটিউবে অমুক গান চালাও", "রহিমকে হোয়াটসঅ্যাপে লিখো…", "কাল বিকাল ৫টায় ক্যালেন্ডারে রাখো", "১০ মিনিট পর মনে করাও"।':''),'']]});
const cur=()=>AGENTS.find(a=>a.id===S.agent)||AGENTS[0];
function bub(t,c,u){const d=document.createElement('div');d.className='m '+c;d.textContent=t;if(u){d.appendChild(document.createElement('br'));const l=document.createElement('a');l.className='go';l.textContent='খুলুন ↗';l.href=u;if(/^https?:/.test(u)){l.target='_blank';l.rel='noopener'}d.appendChild(l)}$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function put(A,t,c,u){MSG[A.id].push([t,c,u]);if(A.id===S.agent)bub(t,c,u)}
const add=(t,c)=>put(cur(),t,c);
function renderAgents(){
  $('#agents').innerHTML=AGENTS.map(a=>`<button data-a="${a.id}" class="${a.id===S.agent?'on':''}"><i style="background:rgb(${a.col})"></i>${a.n}</button>`).join('');
  document.querySelectorAll('#agents button').forEach(b=>b.onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();pick(b.dataset.a)});
}
function pick(id){
  S.agent=id;save();const A=cur();renderAgents();
  $('#who').textContent=A.n+' — '+A.r;$('#txt').placeholder=A.n+'-কে লিখুন…';
  $('#log').innerHTML='';MSG[A.id].forEach(([t,c,u])=>bub(t,c,u));setMode('idle','প্রস্তুত');
}
const LN={'bn-BD':'বাংলা','en-US':'English','ur-PK':'اردو / Roman Urdu','hi-IN':'हिन्दी'};
const enc=encodeURIComponent,pad=n=>String(n).padStart(2,'0');
const TOOLS=[{functionDeclarations:[
{name:'youtube_search',description:'ইউটিউবে গান/ভিডিও খোঁজা ও চালানোর জন্য খোলা',parameters:{type:'OBJECT',properties:{query:{type:'STRING'}},required:['query']}},
{name:'open_app',description:'অ্যাপ বা সাইট খোলা: whatsapp, telegram, tiktok, facebook, instagram, spotify, maps, google, gmail, capcut, youtube',parameters:{type:'OBJECT',properties:{app:{type:'STRING'},query:{type:'STRING',description:'ঐচ্ছিক সার্চ/জায়গার নাম'}},required:['app']}},
{name:'send_message',description:'মেসেজ তৈরি করে পাঠানোর জন্য খোলা (পাঠাতে ব্যবহারকারী নিজে Send চাপবে)',parameters:{type:'OBJECT',properties:{app:{type:'STRING',description:'whatsapp, telegram, sms বা email'},to:{type:'STRING',description:'ফোন নম্বর বা ইমেইল, জানা না থাকলে ফাঁকা'},text:{type:'STRING'},subject:{type:'STRING'}},required:['app','text']}},
{name:'call_phone',description:'ফোন কল করার জন্য ডায়ালার খোলা',parameters:{type:'OBJECT',properties:{number:{type:'STRING'}},required:['number']}},
{name:'add_calendar_event',description:'Google Calendar-এ ইভেন্ট/কাজ রাখা',parameters:{type:'OBJECT',properties:{title:{type:'STRING'},start:{type:'STRING',description:'YYYY-MM-DDTHH:MM (লোকাল) বা শুধু YYYY-MM-DD'},duration_min:{type:'INTEGER'},details:{type:'STRING'}},required:['title','start']}},
{name:'set_reminder',description:'অ্যাপের ভেতরে রিমাইন্ডার (অ্যাপ খোলা থাকলে বাজবে)',parameters:{type:'OBJECT',properties:{text:{type:'STRING'},at:{type:'STRING',description:'YYYY-MM-DDTHH:MM লোকাল'},in_minutes:{type:'NUMBER'}},required:['text']}},
{name:'set_alarm',description:'ফোনের ঘড়িতে অ্যালার্ম (অ্যান্ড্রয়েড)',parameters:{type:'OBJECT',properties:{time:{type:'STRING',description:'HH:MM ২৪ ঘণ্টা'},label:{type:'STRING'}},required:['time']}},
{name:'save_note',description:'স্মৃতি-নোটে কিছু সংরক্ষণ',parameters:{type:'OBJECT',properties:{text:{type:'STRING'}},required:['text']}},
{name:'open_url',description:'যেকোনো ওয়েবসাইট খোলা',parameters:{type:'OBJECT',properties:{url:{type:'STRING'}},required:['url']}}]}];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',9000)}
const ACT={
  youtube_search:a=>({t:'ইউটিউব: '+a.query,url:'https://www.youtube.com/results?search_query='+enc(a.query)}),
  open_app:a=>{const q=enc(a.query||''),k=(a.app||'').toLowerCase(),M={whatsapp:'https://wa.me/',telegram:'https://t.me/',tiktok:q?'https://www.tiktok.com/search?q='+q:'https://www.tiktok.com/',facebook:q?'https://www.facebook.com/search/top?q='+q:'https://www.facebook.com/',instagram:'https://www.instagram.com/',spotify:'https://open.spotify.com/search/'+q,maps:'https://www.google.com/maps/search/?api=1&query='+q,google:'https://www.google.com/search?q='+q,gmail:'https://mail.google.com/',capcut:'https://www.capcut.com/',youtube:'https://www.youtube.com/results?search_query='+q};
    if(!M[k])throw Error('অ্যাপ চিনি না: '+k);return{t:k+' খুলছি'+(a.query?': '+a.query:''),url:M[k]}},
  send_message:a=>{const k=(a.app||'').toLowerCase(),x=enc(a.text||''),to=(a.to||'').trim();
    if(k==='whatsapp'){let d=to.replace(/\D/g,'');if(/^01\d{9}$/.test(d))d='88'+d;return{t:'হোয়াটসঅ্যাপ মেসেজ তৈরি: '+a.text,url:'https://wa.me/'+d+'?text='+x}}
    if(k==='telegram')return{t:'টেলিগ্রাম মেসেজ তৈরি: '+a.text,url:'https://t.me/share/url?url=%20&text='+x};
    if(k==='sms')return{t:'এসএমএস তৈরি: '+a.text,url:'sms:'+to+'?body='+x};
    if(k==='email')return{t:'ইমেইল তৈরি: '+(a.subject||a.text),url:'mailto:'+to+'?subject='+enc(a.subject||'')+'&body='+x};
    throw Error('এই অ্যাপে মেসেজ পারি না: '+k)},

    c.fillStyle=a.st==='sit'?'#0d1218':'#07090c';c.fillRect(sx,sy,14,8);
    if(a.st!=='sit'){c.fillStyle=`rgba(${a.col},${.25+.25*Math.sin(t*2)})`;c.fillRect(sx+6,sy+3,2,2);return}
    if(sel&&mode==='think'){c.fillStyle=col;for(let i=0;i<3;i++)c.fillRect(sx+4+i*3,sy+3+Math.sin(t*6+i)*1.3,2,2);return}
    if(sel&&mode==='speak'){c.fillStyle=col;for(let i=0;i<6;i++){const h=1+Math.abs(Math.sin(t*9+i*1.3))*5;c.fillRect(sx+2+i*2,sy+4-h/2,1.2,h)}return}
    if(a.id==='arin'){c.fillStyle=dim;c.fillRect(sx+1,sy+1,7,2);c.fillStyle=col;c.fillRect(sx+6,sy+3.6,7,2);c.fillStyle=dim;if(Math.floor(t*2)%2)c.fillRect(sx+1,sy+6.4,3,1)}
    else if(a.id==='guru'){c.fillStyle=col;c.fillRect(sx+1,sy+1,8,1.2);const n=1+Math.floor(t/1.2)%3;for(let i=0;i<n;i++){c.fillStyle=col;c.fillRect(sx+1,sy+3.4+i*1.9,1,1);c.fillStyle=dim;c.fillRect(sx+3,sy+3.4+i*1.9,5+(i%2)*2,1)}c.strokeStyle=col;c.lineWidth=.5;c.beginPath();c.arc(sx+11.2,sy+5,2,0,6.283);c.stroke()}
    else if(a.id==='math'){const i=Math.floor(t/2.2)%FM.length;c.fillStyle=col;c.font='bold 3.3px monospace';c.fillText(FM[i],sx+1,sy+4.4);c.fillStyle=dim;c.fillRect(sx+1,sy+6,((t%2.2)/2.2)*12,.8)}
    else if(a.id==='lang'){c.fillStyle=col;c.font='bold 3.4px monospace';c.fillText('Aa',sx+1,sy+3);c.fillStyle=dim;[9,12,7,10].forEach((w,i)=>c.fillRect(sx+1,sy+3.8+i*1.15,w,.7));c.fillStyle=col;c.fillRect(sx+1+(Math.floor(t*2)%6),sy+5,2.5,.8);if(Math.floor(t*3)%2)c.fillRect(sx+11,sy+1,.7,1.8)}
    else if(a.id==='quiz'){c.fillStyle=col;c.fillRect(sx+1,sy+1,10,1.2);const k=Math.floor(t/1.4)%3;for(let i=0;i<3;i++){c.fillStyle=i===k?(i===1?'#2ee27a':'#d9534f'):dim;c.fillRect(sx+1,sy+3+i*1.7,12,1.2)}}
    else{c.fillStyle=col;c.fillRect(sx+1,sy+.8,12,.8);const k=Math.floor(t*1.3)%12;for(let r=0;r<3;r++)for(let q=0;q<4;q++){c.fillStyle=(r*4+q)===k?col:dim;c.fillRect(sx+1+q*3.1,sy+2.4+r*1.9,2.6,1.5)}}
  }
  function desk(r){
    const dy=r.dy,x=r.dcx-17,a=AGS[r.i];
    c.fillStyle='#6b4a30';c.fillRect(x,dy,34,14);c.fillStyle='#7d5a3c';c.fillRect(x,dy,34,2);c.fillStyle='#3f2c1c';c.fillRect(x,dy+12,34,2);
    c.fillStyle='#0a0c10';c.fillRect(r.dcx-8,dy-11,16,11);c.fillRect(r.dcx-1.5,dy-1,3,1.5);
    screen(a,r.dcx-7,dy-10);
    c.fillStyle='#1a1d22';c.fillRect(r.dcx-9,dy+6,11,3);c.fillStyle='#e8e8e8';c.fillRect(x+3,dy+4,3,3);
  }
  function sprite(a){
    const tr=a.tr,x=a.x,Y=a.y,sit=a.st==='sit',walk=a.st==='go'||a.st==='back',ph=TW.t*7,fr=Math.floor(TW.t*8)%2;
    const v=sit?'back':(a.view||'front'),sd=a.sd||1,side=v==='side',back=v==='back';
    const y=Y-(walk?Math.abs(Math.sin(ph))*.6:0),jk=R(a.col),jd=shade(a.col,.6),sk=R(tr.skin),skd=shade(tr.skin,.8);
    const sw=(tr.f?4.2:4.8)*(side?.62:1),ww=side?(tr.f?2.2:2.6):(tr.f?3.1:3.7);
    c.fillStyle='rgba(0,0,0,.33)';c.beginPath();c.ellipse(x,Y,5.2,1.6,0,0,6.283);c.fill();
    if(a.id===S.agent){c.strokeStyle=`rgba(${a.col},.9)`;c.lineWidth=.6;c.beginPath();c.ellipse(x,Y,6.4,2.2,0,0,6.283);c.stroke()}
    c.lineCap='round';
    if(tr.st==='long'&&v==='front'){c.fillStyle=tr.hair;c.beginPath();c.ellipse(x,y-21.5,3.6,4.2,0,0,6.283);c.fill()}
    if(sit){c.fillStyle='#1c2330';c.fillRect(x-3.6,y-10,7.2,3)}
    else for(const k of[-1,1]){
      const s2=walk?Math.sin(ph+(k>0?Math.PI:0)):0,lift=Math.max(0,s2)*1.8,hx=side?x+k*.3:x+k*1.4,fx=side?x+s2*2.4:x+k*(1.4+s2*.5),fy=Y-lift;
      c.strokeStyle='#1c2330';c.lineWidth=2.5;c.beginPath();c.moveTo(hx,y-9.5);c.lineTo(fx,fy-1);c.stroke();
      c.fillStyle='#0c0d10';c.beginPath();c.ellipse(fx+(side?sd*.5:0),fy-.6,side?2:1.6,1,0,0,6.283);c.fill();
    }
    c.fillStyle=jk;c.beginPath();c.moveTo(x-sw+.2,y-16.8);c.quadraticCurveTo(x-sw-.1,y-18,x-sw+1.2,y-18);c.lineTo(x+sw-1.2,y-18);c.quadraticCurveTo(x+sw+.1,y-18,x+sw-.2,y-16.8);c.lineTo(x+ww,y-9);c.lineTo(x-ww,y-9);c.closePath();c.fill();
    if(v==='front'){
      c.fillStyle='#e9ecef';c.beginPath();c.moveTo(x-1.7,y-18);c.lineTo(x,y-14.3);c.lineTo(x+1.7,y-18);c.closePath();c.fill();
      c.strokeStyle=jd;c.lineWidth=.4;c.beginPath();c.moveTo(x-1.7,y-18);c.lineTo(x-.5,y-12.5);c.moveTo(x+1.7,y-18);c.lineTo(x+.5,y-12.5);c.stroke();
    }else if(back){c.strokeStyle=jd;c.lineWidth=.4;c.beginPath();c.moveTo(x,y-18);c.lineTo(x,y-9);c.stroke()}
    c.fillStyle='#14171c';c.fillRect(x-ww,y-9.6,ww*2,.7);
    c.fillStyle=skd;c.fillRect(x-1.2,y-19.4,2.4,2);
    for(const k of[-1,1]){
      const sx=side?x+k*.8:x+k*(sw-.1),sy=y-16.6;let hx=sx+k*.4,hy=y-9.4;
      if(sit){hx=x+k*3.6;hy=y-20.2+((fr+(k>0?1:0))%2)*.5}
      else if(walk){const sg=Math.sin(ph+(k>0?0:Math.PI));if(side){hx=sx+sg*2.2;hy=y-9.8}else{hx=sx+k*.5;hy=y-9.6+sg*1.6}}
      c.strokeStyle=jk;c.lineWidth=2.4;c.beginPath();c.moveTo(sx,sy);c.lineTo(hx,hy-.6);c.stroke();
      c.fillStyle=sk;c.beginPath();c.arc(hx,hy,1,0,6.283);c.fill();
    }
    if(back){
      c.fillStyle=skd;c.beginPath();c.arc(x-2.9,y-22,.7,0,6.283);c.arc(x+2.9,y-22,.7,0,6.283);c.fill();
      c.fillStyle=tr.hair;c.beginPath();c.ellipse(x,y-22.4,3.1,3.45,0,0,6.283);c.fill();
      if(tr.st==='long')c.fillRect(x-3.4,y-22.4,6.8,8);
      if(tr.st==='bun'){c.beginPath();c.arc(x,y-26.6,1.6,0,6.283);c.fill()}
    }else if(side){
      c.fillStyle=skd;c.beginPath();c.arc(x-sd*.4,y-22,.7,0,6.283);c.fill();
      c.fillStyle=sk;c.beginPath();c.ellipse(x,y-22.2,2.6,3.4,0,0,6.283);c.fill();
      c.fillStyle=tr.hair;c.beginPath();c.ellipse(x-sd*.4,y-23.1,3.1,2.8,0,Math.PI,0);c.fill();
      c.fillRect(sd>0?x-3.1:x+.6,y-23.4,2.5,tr.st==='long'?9:4);
      if(tr.st==='bun'){c.beginPath();c.arc(x-sd*1.8,y-26.2,1.6,0,6.283);c.fill()}
      c.fillStyle='#17110e';c.beginPath();c.ellipse(x+sd*1.4,y-22.3,.45,.35,0,0,6.283);c.fill();
      c.strokeStyle=tr.hair;c.lineWidth=.35;c.beginPath();c.moveTo(x+sd*.7,y-23.2);c.lineTo(x+sd*2,y-23.2);c.stroke();
      c.fillStyle=skd;c.beginPath();c.moveTo(x+sd*2.5,y-22.3);c.lineTo(x+sd*3.5,y-21.3);c.lineTo(x+sd*2.5,y-21);c.closePath();c.fill();
      c.strokeStyle='#8a4b3a';c.beginPath();c.moveTo(x+sd*1.5,y-20.3);c.lineTo(x+sd*2.4,y-20.3);c.stroke();
      if(tr.gl){c.strokeStyle='#222';c.lineWidth=.3;c.beginPath();c.arc(x+sd*1.4,y-22.3,.95,0,6.283);c.moveTo(x+sd*.45,y-22.3);c.lineTo(x-sd*.4,y-22.3);c.stroke()}
    }else{
      c.fillStyle=skd;c.beginPath();c.arc(x-2.9,y-22,.7,0,6.283);c.arc(x+2.9,y-22,.7,0,6.283);c.fill();
      c.fillStyle=sk;c.beginPath();c.ellipse(x,y-22.2,2.9,3.4,0,0,6.283);c.fill();
      c.fillStyle=tr.hair;c.beginPath();c.ellipse(x,y-23.3,3.15,2.7,0,Math.PI,0);c.fill();c.fillRect(x-3.15,y-23.4,.9,2.2);c.fillRect(x+2.25,y-23.4,.9,2.2);
      if(tr.st==='long'){c.fillRect(x-3.7,y-23,1.3,7);c.fillRect(x+2.4,y-23,1.3,7)}
      if(tr.st==='bun'){c.beginPath();c.arc(x,y-26.6,1.6,0,6.283);c.fill()}
      c.fillStyle='#17110e';c.beginPath();c.ellipse(x-1.15,y-22.3,.5,.35,0,0,6.283);c.ellipse(x+1.15,y-22.3,.5,.35,0,0,6.283);c.fill();
      c.lineWidth=.35;c.strokeStyle=tr.hair;c.beginPath();c.moveTo(x-1.8,y-23.2);c.lineTo(x-.6,y-23.2);c.moveTo(x+.6,y-23.2);c.lineTo(x+1.8,y-23.2);c.stroke();
      c.lineWidth=.3;c.strokeStyle=shade(tr.skin,.7);c.beginPath();c.moveTo(x,y-22);c.lineTo(x,y-21.2);c.stroke();
      c.strokeStyle='#8a4b3a';c.lineWidth=.35;c.beginPath();c.moveTo(x-.8,y-20.3);c.lineTo(x+.8,y-20.3);c.stroke();
      if(tr.gl){c.strokeStyle='#222';c.lineWidth=.3;c.beginPath();c.arc(x-1.15,y-22.3,.95,0,6.283);c.moveTo(x+2.1,y-22.3);c.arc(x+1.15,y-22.3,.95,0,6.283);c.moveTo(x-.2,y-22.3);c.lineTo(x+.2,y-22.3);c.stroke()}
    }
  }
  function label(a){
    const sit=a.st==='sit',x=Math.round(a.x),y=Math.round(a.y)+(sit?10:-32);c.font='bold 5px monospace';
    const w=Math.ceil(c.measureText(a.n).width)+8;
    c.fillStyle='rgba(8,10,14,.85)';c.fillRect(x-w/2,y-6,w,8);
    c.fillStyle=R(a.col);c.fillRect(x-w/2+2,y-3,2,2);
    c.fillStyle=a.id===S.agent?'#fff':'#c8cdd4';c.fillText(a.n,x-w/2+6,y);
    if(!sit&&a.id===S.agent&&(mode==='think'||mode==='speak')){c.fillStyle='#fff';c.fillRect(x-8,y-17,16,9);c.fillStyle='#111';c.fillText(mode==='think'?'...':'~',x-4,y-10)}
  }
  let lastTxt='';
  function render(){
    c.setTransform(K,0,0,K,0,0);c.clearRect(0,0,W,H);
    c.fillStyle='#141a22';c.fillRect(6,100,308,28);
    c.fillStyle=`rgba(${S.rgb},.3)`;for(let x=10;x<312;x+=12)c.fillRect(x,113,6,1);
    rooms.forEach(r=>{floor(r);deco(r);chair(r);walls(r)});
    const it=[];rooms.forEach(r=>it.push({y:r.dy+14,f:()=>desk(r)}));
    AGS.forEach(a=>it.push({y:a.y,f:()=>sprite(a)}));
    it.sort((p,q)=>p.y-q.y).forEach(o=>o.f());
    AGS.forEach(label);
    const seated=AGS.filter(a=>a.st==='sit').length,busy=(mode==='think'||mode==='speak')?1:0;
    const t='● Online   ·   '+seated+'/6 সিটে   ·   '+busy+'/6 ব্যস্ত';if(t!==lastTxt){lastTxt=t;$('#twst').textContent=t}
  }
  cv.onclick=e=>{const b=cv.getBoundingClientRect(),lx=(e.clientX-b.left)/b.width*W,ly=(e.clientY-b.top)/b.height*H;
    let best=null,bd=1e9;AGS.forEach(a=>{const d=Math.hypot(lx-a.x,ly-(a.y-13));if(d<16&&d<bd){bd=d;best=a}});
    if(best){if('speechSynthesis' in window)speechSynthesis.cancel();pick(best.id)}};
  TW={t:0};let last=performance.now();
  (function loop(now){
    requestAnimationFrame(loop);
    if(!$('#v-town').classList.contains('on')){last=now;return}
    const dt=Math.min(.05,(now-last)/1000);last=now;TW.t+=dt;
    AGS.forEach(a=>step(a,dt));render();
  })(last);
}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
S.agent=cur().id;pick(S.agent);
