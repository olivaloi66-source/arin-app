<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>ARIN</title>
<style>
:root{--c:255,40,40;--bg:#050607;--panel:#0d0f12;--line:#1c2026;--tx:#e8eaed;--mut:#7d8590;box-sizing:border-box}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali',system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.35em;font-size:15px;color:rgb(var(--c))}
header span{font-size:11px;color:var(--mut)}
#stage{position:relative;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:6px}
canvas{width:180px;height:180px}
#log{min-height:110px}
#agents{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
#agents button{flex:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:6px 11px;font:inherit;font-size:12px;display:flex;gap:6px;align-items:center}
#agents button i{width:8px;height:8px;border-radius:50%;display:block}
#agents button.on{border-color:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.35)}
#who{font-size:11px;color:var(--mut);padding:5px 14px 0}
#stage:not(.on){display:none}
#state{font-size:12px;color:var(--mut);margin-top:-6px;height:16px}
#nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;padding:12px 14px 6px;position:relative}
#nodes::before{content:"";position:absolute;left:14%;right:14%;top:0;height:12px;border:1px solid rgba(var(--c),.45);border-bottom:0;border-radius:10px 10px 0 0}
.node{background:var(--panel);color:var(--tx);border:1px solid rgba(var(--c),.45);border-radius:10px;padding:9px 0;font-size:12px;box-shadow:0 0 12px rgba(var(--c),.15)}
.node:active{background:rgba(var(--c),.18)}
#log{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.5;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}
.m.u{align-self:flex-end;background:rgba(var(--c),.14);border-color:rgba(var(--c),.4)}
.m.e{color:#ff9b9b}
.m.act{border-color:rgb(var(--c));align-self:flex-start}
.m a.go{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:14px;background:rgb(var(--c));color:#000;text-decoration:none;font-weight:700;font-size:13px}
#toast{position:fixed;top:10px;left:10px;right:10px;z-index:99;padding:12px 14px;border-radius:12px;background:rgb(var(--c));color:#000;font-weight:700;display:none}
#bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
#txt{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:22px;padding:11px 14px;font:inherit;font-size:14px;outline:none;min-width:0}
#txt:focus{border-color:rgb(var(--c))}
.btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(var(--c),.6);background:var(--panel);color:var(--tx);font-size:18px;flex:none}
#mic.on{background:rgb(var(--c));color:#000;box-shadow:0 0 18px rgba(var(--c),.7)}
#stop{font-size:11px;width:auto;border-radius:20px;padding:0 12px;height:34px}
#sheet{position:fixed;inset:auto 0 0 0;max-height:72%;overflow-y:auto;background:var(--panel);border-top:1px solid rgb(var(--c));border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
#sheet.open{transform:none}
#sheet h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px;font:inherit;font-size:14px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #333;display:block}
.sw input[type=color]{width:42px;height:34px;padding:0;border-radius:8px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.pill u{color:rgb(var(--c));text-decoration:none}
.go{background:rgb(var(--c));color:#000;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600}

#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font:inherit;font-size:13px;border-bottom:2px solid transparent}
#tabs button.on{color:rgb(var(--c));border-bottom-color:rgb(var(--c))}
.view{display:none;flex-direction:column;align-items:center;padding:8px 12px}
.view.on{display:flex}
.view canvas.w{width:100%;max-width:360px;height:auto;image-rendering:pixelated;border:1px solid rgba(var(--c),.4);border-radius:10px;background:var(--bg)}
.cap{font-size:11px;color:var(--mut);margin-top:6px;text-align:center}
.feed{width:100%;max-width:360px;margin-top:8px}
.feed div{font-size:11px;color:var(--mut);border-left:2px solid rgba(var(--c),.5);padding:3px 8px;margin-top:4px}
#mute{display:flex;align-items:center;justify-content:center;padding:0}#mute.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.m img,.m video{max-width:100%;border-radius:8px;display:block;margin-top:6px}
.m button.go{margin-top:6px}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<header><b>ARIN</b><span id="net">অফলাইন</span></header>
<div id="tabs"><button class="on" data-t="orb">Orb</button><button data-t="media">Media</button><button data-t="town">Agent Town</button></div>
<div id="toast" onclick="this.style.display='none'"></div><div id="agents"></div><div id="who"></div>
<div id="stage" class="view on">
  <canvas id="orb" width="460" height="460"></canvas>
  <div id="state">প্রস্তুত</div>
  <div id="nodes">
    <button class="node" data-p="memory">Memory</button>
    <button class="node" data-p="skills">Skills</button>
    <button class="node" data-p="voices">Voices</button>
    <button class="node" data-p="settings">Settings</button>
  </div>
</div>
<div id="v-media" class="view">
  <canvas class="w" id="gl" width="360" height="230"></canvas>
  <div class="cap">Media Link (ডেমো ডিজাইন)</div>
  <div class="feed"><div>সিগন্যাল খুঁজছি…</div><div>কেন্দ্রীয় টেলিমেট্রির সাথে যুক্ত হচ্ছি…</div><div>ভৌগোলিক তথ্য আনছি…</div><div>লাইভ খবর যোগ হবে পরের ধাপে</div></div>
</div>
<div id="v-town" class="view">
  <canvas class="w" id="tw" width="960" height="684"></canvas>
  <div class="cap" id="twst">● Online</div>
  <div class="cap">Agent Town: যেকোনো এজেন্টের গায়ে চাপ দিলে তার সাথে কথা বলা যাবে</div>
</div>
<div id="log"></div>
<div id="bar">
  <input id="txt" placeholder="ARIN-কে লিখুন…" autocomplete="off">
  <button class="btn" id="send">➤</button>
  <button class="btn" id="mute" title="মিউট"></button>
</div>
<div id="sheet"></div>

<script>
const $=s=>document.querySelector(s);
const S={key:'',lang:'bn-BD',voice:'',rgb:'255,40,40',bg:'5,6,7',agent:'arin',rem:[],notes:[],model:'gemini-3.8-flash',liveModel:'gemini-3.1-flash-live-preview',imgModel:'gemini-nano-banana-2.1',mlist:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('arin')||'{}'))}catch(e){}
if(/^gemini-2\./.test(S.model))S.model='gemini-3.8-flash';if(/^gemini-2\./.test(S.imgModel))S.imgModel='gemini-nano-banana-2.1';
const save=()=>{try{localStorage.setItem('arin',JSON.stringify(S))}catch(e){}};
function theme(){const r=document.documentElement.style,b=S.bg.split(',').map(Number),lt=(b[0]*.3+b[1]*.59+b[2]*.11)>140,sh=d=>b.map(v=>Math.max(0,Math.min(255,v+(lt?-d:d)))).join(',');
r.setProperty('--c',S.rgb);r.setProperty('--bg','rgb('+S.bg+')');r.setProperty('--panel','rgb('+sh(10)+')');r.setProperty('--line','rgb('+sh(26)+')');r.setProperty('--tx',lt?'#14171a':'#e8eaed');r.setProperty('--mut',lt?'#5b636d':'#7d8590');
const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','rgb('+S.bg+')')}theme();
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(',');
const rgb2hex=r=>'#'+r.split(',').map(n=>(+n).toString(16).padStart(2,'0')).join('');
$('#net').textContent=navigator.onLine?'অনলাইন':'অফলাইন';
addEventListener('online',()=>$('#net').textContent='অনলাইন');
addEventListener('offline',()=>$('#net').textContent='অফলাইন');

/* ---------- Orb ---------- */
const cv=$('#orb'),g=cv.getContext('2d');
const P=Array.from({length:520},()=>{const u=Math.random()*2-1,t=Math.random()*6.283,r=Math.sqrt(1-u*u);return{x:r*Math.cos(t),y:u,z:r*Math.sin(t),s:Math.random()*1.3+.5}});
let mode='idle',ang=0,energy=0;
function draw(){
  const W=460,k=mode==='listen'?1.12:mode==='speak'?1.06:mode==='think'?.96:1;
  energy+=((mode==='idle'?0:1)-energy)*.05;
  ang+=.004+energy*.012;
  g.clearRect(0,0,W,W);
  const pulse=1+Math.sin(Date.now()/(mode==='speak'?120:380))*.04*energy;
  const R=150*k*pulse,ca=Math.cos(ang),sa=Math.sin(ang);
  for(const p of P){
    const x=p.x*ca+p.z*sa,z=-p.x*sa+p.z*ca,y=p.y;
    const f=(z+1.4)/2.4,a=.15+f*.85;
    g.fillStyle=`rgba(${S.rgb},${a})`;
    g.beginPath();g.arc(W/2+x*R,W/2+y*R,p.s*f*1.6,0,6.283);g.fill();
  }
  const gr=g.createRadialGradient(W/2,W/2,R*.2,W/2,W/2,R*1.3);
  gr.addColorStop(0,`rgba(${S.rgb},${.12+energy*.1})`);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,W);
  requestAnimationFrame(draw);
}
draw();
const setMode=(m,t)=>{if(m==='idle'&&live){if(muted)t='মিউট করা আছে';else{m='listen';t='শুনছি…'}}mode=m;$('#state').textContent=t};

/* ---------- Chat ---------- */
const AGENTS=[
{id:'arin',n:'ARIN',r:'প্রধান সহকারী',col:'192,57,43',p:'তুমি ARIN, শিক্ষার্থীর প্রধান সহকারী। সাধারণ প্রশ্নের উত্তর দাও, আর কাজটি বিশেষ হলে বলো কোন এজেন্ট (GURU, MATH, LANG, QUIZ, PLAN) ভালো সাহায্য করবে।'},
{id:'guru',n:'GURU',r:'শিক্ষক: পাঠ সহজে বোঝান',col:'42,111,176',p:'তুমি GURU, ধৈর্যশীল শিক্ষক। যেকোনো পাঠ ছোট ছোট ধাপে, সহজ উদাহরণ দিয়ে বোঝাও এবং শেষে একটি প্রশ্ন করে বোঝা যাচাই করো।'},
{id:'math',n:'MATH',r:'গণিত ও বিজ্ঞান সমাধান',col:'46,139,87',p:'তুমি MATH, গণিত, পদার্থ, রসায়ন ও জীববিজ্ঞানের সমাধানকারী। ধাপে ধাপে হিসাব দেখাও, সূত্র বলো, শেষে উত্তর যাচাই করো।'},
{id:'lang',n:'LANG',r:'ভাষা ও লেখা',col:'123,79,181',p:'তুমি LANG, বাংলা ও ইংরেজির শিক্ষক। ব্যাকরণ, অনুবাদ, রচনা, চিঠি ও অনুচ্ছেদ লেখায় সাহায্য করো এবং ভুল শুধরে কারণ বুঝিয়ে দাও।'},
{id:'quiz',n:'QUIZ',r:'কুইজ ও পরীক্ষার প্রস্তুতি',col:'184,135,42',p:'তুমি QUIZ, পরীক্ষার প্রশিক্ষক। একবারে একটি প্রশ্ন করো, উত্তরের পর সঠিক বা ভুল জানিয়ে ব্যাখ্যা দাও, তারপর পরের প্রশ্ন দাও।'},
{id:'plan',n:'PLAN',r:'স্টাডি প্ল্যান ও রুটিন',col:'20,150,170',p:'তুমি PLAN, পড়ার পরিকল্পনাকারী। শিক্ষার্থীর সময়, বিষয় ও পরীক্ষার তারিখ জেনে বাস্তবসম্মত দৈনিক রুটিন বানাও।'}];
const MSG={},HIST={};
AGENTS.forEach(a=>{HIST[a.id]=[];MSG[a.id]=[['আমি '+a.n+', '+a.r+'। মাইক নিজে থেকেই চালু থাকে, শুধু কথা বলুন। চুপ থাকতে চাইলে মিউট বাটন চাপুন, অথবা লিখুন।'+(a.id==='arin'?' প্রথমে Settings-এ Gemini API key বসান। বলুন: "ইউটিউবে অমুক গান চালাও", "রহিমকে হোয়াটসঅ্যাপে লিখো…", "কাল বিকাল ৫টায় ক্যালেন্ডারে রাখো", "১০ মিনিট পর মনে করাও"।':''),'']]});
try{const B=JSON.parse(localStorage.getItem('arin_brain')||'{}');for(const id in B.MSG||{})if(MSG[id]&&B.MSG[id].length)MSG[id]=B.MSG[id];for(const id in B.HIST||{})if(HIST[id])HIST[id]=B.HIST[id]}catch(e){}
const saveBrain=()=>{try{const M={},H={};for(const id in MSG)M[id]=MSG[id].slice(-150);for(const id in HIST)H[id]=HIST[id].slice(-40);localStorage.setItem('arin_brain',JSON.stringify({MSG:M,HIST:H}))}catch(e){}};
const cur=()=>AGENTS.find(a=>a.id===S.agent)||AGENTS[0];
function bub(t,c,u){const d=document.createElement('div');d.className='m '+c;d.textContent=t;if(u){d.appendChild(document.createElement('br'));const l=document.createElement('a');l.className='go';l.textContent='খুলুন ↗';l.href=u;if(/^https?:/.test(u)){l.target='_blank';l.rel='noopener'}d.appendChild(l)}$('#log').appendChild(d);$('#log').scrollTop=1e9;return d}
function put(A,t,c,u){MSG[A.id].push([t,c,u]);saveBrain();if(A.id===S.agent)bub(t,c,u)}
const add=(t,c)=>put(cur(),t,c);
function renderAgents(){
  $('#agents').innerHTML=AGENTS.map(a=>`<button data-a="${a.id}" class="${a.id===S.agent?'on':''}"><i style="background:rgb(${a.col})"></i>${a.n}</button>`).join('');
  document.querySelectorAll('#agents button').forEach(b=>b.onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();pick(b.dataset.a)});
}
function pick(id){
  S.agent=id;save();const A=cur();renderAgents();
  $('#who').textContent=A.n+' — '+A.r;$('#txt').placeholder=A.n+'-কে লিখুন…';
  $('#log').innerHTML='';MSG[A.id].forEach(([t,c,u])=>bub(t,c,u));setMode('idle','প্রস্তুত');if(typeof LV!=='undefined'&&LV.on)lvRestart();
}
const LN={'bn-BD':'বাংলা','en-US':'English','ur-PK':'اردو / Roman Urdu','hi-IN':'हिन्दी'};
const enc=encodeURIComponent,pad=n=>String(n).padStart(2,'0');
const TOOLS=[{functionDeclarations:[
{name:'youtube_search',description:'ইউটিউবে গান/ভিডিও খোঁজা ও চালানোর জন্য খোলা',parameters:{type:'OBJECT',properties:{query:{type:'STRING'}},required:['query']}},
{name:'open_app',description:'ফোনের যেকোনো অ্যাপ খোলা। নাম (ইংরেজিতে): youtube, tiktok, facebook, messenger, instagram, whatsapp, telegram, snapchat, x, spotify, maps, google, gmail, chrome, photos, playstore, capcut, inshot, snapseed, picsart, vn, imo, bkash, nagad। তালিকায় না থাকলে package-এ অ্যান্ড্রয়েড প্যাকেজ নাম দাও',parameters:{type:'OBJECT',properties:{app:{type:'STRING'},query:{type:'STRING',description:'ঐচ্ছিক সার্চ/জায়গার নাম'},package:{type:'STRING',description:'অ্যান্ড্রয়েড প্যাকেজ নাম, যেমন com.example.app'}},required:['app']}},
{name:'send_message',description:'মেসেজ তৈরি করে পাঠানোর জন্য খোলা (পাঠাতে ব্যবহারকারী নিজে Send চাপবে)',parameters:{type:'OBJECT',properties:{app:{type:'STRING',description:'whatsapp, telegram, sms বা email'},to:{type:'STRING',description:'ফোন নম্বর বা ইমেইল, জানা না থাকলে ফাঁকা'},text:{type:'STRING'},subject:{type:'STRING'}},required:['app','text']}},
{name:'call_phone',description:'ফোন কল করার জন্য ডায়ালার খোলা',parameters:{type:'OBJECT',properties:{number:{type:'STRING'}},required:['number']}},
{name:'add_calendar_event',description:'Google Calendar-এ ইভেন্ট/কাজ রাখা',parameters:{type:'OBJECT',properties:{title:{type:'STRING'},start:{type:'STRING',description:'YYYY-MM-DDTHH:MM (লোকাল) বা শুধু YYYY-MM-DD'},duration_min:{type:'INTEGER'},details:{type:'STRING'}},required:['title','start']}},
{name:'set_reminder',description:'অ্যাপের ভেতরে রিমাইন্ডার (অ্যাপ খোলা থাকলে বাজবে)',parameters:{type:'OBJECT',properties:{text:{type:'STRING'},at:{type:'STRING',description:'YYYY-MM-DDTHH:MM লোকাল'},in_minutes:{type:'NUMBER'}},required:['text']}},
{name:'set_alarm',description:'ফোনের ঘড়িতে অ্যালার্ম (অ্যান্ড্রয়েড)',parameters:{type:'OBJECT',properties:{time:{type:'STRING',description:'HH:MM ২৪ ঘণ্টা'},label:{type:'STRING'}},required:['time']}},

  const v=speechSynthesis.getVoices().find(x=>x.name===S.voice)||speechSynthesis.getVoices().find(x=>x.lang.replace('_','-')===S.lang);
